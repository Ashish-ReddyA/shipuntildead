name: Build Hostinger website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hostinger-website
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:export
      - run: node scripts/verify-seo.mjs
      - run: npx tsc --noEmit
      - run: node scripts/verify-hostinger-app.mjs
      - name: Update the ready-to-deploy branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git worktree add "$RUNNER_TEMP/hostinger-site" origin/hostinger
          rsync -a --delete --exclude='.git' --exclude='.vite' --exclude='dist' dist/client/ "$RUNNER_TEMP/hostinger-site/"
          cd "$RUNNER_TEMP/hostinger-site"
          git add --all
          if git diff --cached --quiet; then
            echo 'Published files already match the build.'
          else
            git commit -m "Build website from ${GITHUB_SHA}"
            git push origin HEAD:hostinger
          fi

